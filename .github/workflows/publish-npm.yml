name: Publish to npm

on:
  schedule:
    # Run hourly at minute 15
    - cron: "15 * * * *"
  workflow_dispatch:

# Authenticates to npm with trusted publishing (OIDC): the `devin` package must
# list this repository and workflow file as a trusted publisher on npmjs.com.
# No npm token is stored; provenance attestations are generated automatically.
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Trusted publishing needs npm >= 11.5.1; Node 22 bundles npm 10.
      - name: Update npm
        run: npm install -g npm@latest && npm --version

      - name: Publish new manifest version to npm
        run: python scripts/publish_npm.py --provenance
